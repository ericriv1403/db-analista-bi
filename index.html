  function renderMore(){const books=state.books.slice().sort((a,b)=>(a.doneDate?'1':'0').localeCompare(b.doneDate?'1':'0'));return `
    <section class="hero"><div class="eyebrow">Tu biblioteca y herramientas</div><h1 style="margin-top:9px">Una vida más completa.</h1><p>Libros, instrucciones para los días difíciles, cuidado personal y copias de seguridad.</p></section>
    <section class="section"><div class="section-heading"><h2>Mi biblioteca</h2><span class="hint">Meta deseada: 2 libros/mes</span></div><div class="card"><form id="book-form" class="form-grid"><div class="field wide"><label for="book-title">Título del libro</label><input name="title" id="book-title" maxlength="180" placeholder="¿Qué quieres leer?" required></div><div class="field"><label for="book-pages">Páginas totales (opcional)</label><input name="pages" id="book-pages" type="number" min="1" max="10000" step="1" placeholder="Ej.: 220"></div><div class="field" style="align-self:end"><button class="btn primary full" type="submit">Añadir libro</button></div></form><div class="rule"></div>${books.length?books.map(b=>`<div class="exp-row"><div style="min-width:0;flex:1"><div class="name">${esc(b.title)}</div><div class="details">${b.doneDate?'Terminado '+niceDate(b.doneDate):'En lectura'}${b.pages?' · '+(b.progress||0)+' / '+b.pages+' páginas':''}</div>${b.pages?`<div class="mt8">${bar(num(b.progress),num(b.pages))}</div>`:''}<div class="action-row mt8">${!b.doneDate&&b.pages?`<button class="btn small" data-action="book-pages" data-value="${esc(b.id)}">Actualizar páginas</button>`:''}${!b.doneDate?`<button class="btn small soft" data-action="book-finish" data-value="${esc(b.id)}">Terminado ✓</button>`:''}<button class="btn small danger" data-action="del-book" data-value="${esc(b.id)}">Eliminar</button></div></div></div>`).join(''):'<div class="empty">Agrega el libro que quieres empezar esta semana.</div>'}</div></section>
    <section class="section"><div class="section-heading"><h2>Instrucciones y variantes</h2><span class="hint">Abre lo que necesites</span></div>${guides()}</section>
    <section class="section"><div class="section-heading"><h2>Privacidad y seguridad</h2><span class="hint">Tus datos</span></div><div class="card"><div class="alert warn">Los registros de salud, sexualidad y finanzas quedan en el almacenamiento local de este navegador. No están cifrados ni se sincronizan. Si borras datos del navegador, cambias de teléfono o abres otro navegador, podrías perderlos.</div><div class="action-row mt12"><button class="btn primary" data-action="export">Descargar copia JSON</button><button class="btn" data-action="import">Restaurar copia</button><button class="btn" data-action="csv">Exportar hábitos CSV</button></div><div class="rule"></div><div class="checkline"><input type="checkbox" id="dark-toggle" data-settings-check="dark" ${state.settings.theme==='dark'?'checked':''}><label for="dark-toggle">Usar tema oscuro</label></div><div class="action-row mt12"><button class="btn danger" data-action="clear">Eliminar todos mis datos locales</button></div><p class="bottom-note mt12">Consejo: exporta una copia cada domingo. Guárdala en un lugar privado y no compartas el archivo sin revisar su contenido sensible.</p></div></section>
    <details class="mt16"><summary>Fuentes médicas verificables</summary><div class="detail-body"><p>Recomendaciones generales para contrastar la seguridad del plan; requieren internet al abrir los enlaces:</p><ul>
<li><a href="https://www.acc.org/About-ACC/Press-Releases/2026/03/13/18/01/ACCAHA-Issue-Updated-Guideline-for-Managing-Lipids-Cholesterol" target="_blank" rel="noopener noreferrer">ACC/AHA (2026): manejo de dislipidemias</a></li>
<li><a href="https://www.who.int/es/news/item/02-07-2024-who-releases-first-ever-clinical-treatment-guideline-for-tobacco-cessation-in-adults" target="_blank" rel="noopener noreferrer">OMS (2024): tratamiento del tabaquismo</a></li>
<li><a href="https://www.who.int/initiatives/behealthy/physical-activity" target="_blank" rel="noopener noreferrer">OMS: actividad física para adultos</a></li>
<li><a href="https://www.niddk.nih.gov/health-information/informacion-de-la-salud/enfermedades-urologicas/disfuncion-erectil" target="_blank" rel="noopener noreferrer">NIDDK: disfunción eréctil y evaluación</a></li>
<li><a href="https://www.fda.gov/medical-devices/aesthetic-cosmetic-devices/microneedling-devices" target="_blank" rel="noopener noreferrer">FDA: seguridad del microneedling</a></li>
</ul><p>Tu médico debe individualizar el tratamiento según tus análisis y medicamentos.</p></div></details>
<div class="tiny mt16">Plan basado en tu PDF del 23 nov. 2026 al 31 mar. 2027. Esta herramienta no envía datos ni reemplaza evaluación médica.</div>`}
  function guides(){const details=[
  ['Si llego agotado',`<p><b>Mínimo:</b> 5 minutos suaves o descanso si estás enfermo; 2 páginas; cena sencilla; teléfono apartado 10 minutos.</p><p><b>Normal:</b> 15–25 minutos caminando y lectura prevista.</p><p><b>Extra:</b> fuerza A/B o escuchar un álbum, sin reducir sueño.</p>`],
  ['Si quiero fumar después de comer',`<ol><li>Levántate de la mesa.</li><li>Bebe agua y cambia de ambiente.</li><li>Lávate los dientes o usa chicle sin azúcar.</li><li>Camina 5 minutos.</li><li>Retrasa el impulso otros 5 minutos y pide apoyo.</li></ol><p>Desde el 4 de enero la meta es <b>cero tabaco</b>. Una recaída no implica abandonar el plan. Solicita apoyo clínico para tratamientos eficaces.</p>`],
  ['Si me invitan a beber',`<p><b>Antes:</b> decide bebida sin alcohol y salida. <b>Durante:</b> pide agua con gas o bebida sin azúcar. Puedes decir «Estoy cuidando mis triglicéridos, por ahora no tomo».</p><p>Con TG 300–499 mg/dL se prioriza abstinencia durante la reevaluación. Si hay síntomas de abstinencia alcohólica, requiere atención médica.</p>`],
  ['Fuerza A (15–25 min)',`<p>Calienta 3 minutos moviendo articulaciones y caminando.</p><ol><li>Sentadilla a silla: 8–12 repeticiones.</li><li>Flexión contra pared o mesa: 6–12.</li><li>Puente de glúteos: 10–15.</li><li>Bird dog: 6–10 por lado.</li></ol><p>Empieza con una serie, sin dolor, y progresa a dos si toleras bien. Descansa 60–90 segundos entre ejercicios.</p>`],
  ['Fuerza B (15–25 min)',`<p>Calienta 3 minutos.</p><ol><li>Zancada asistida o paso atrás: 6–10 por lado.</li><li>Bisagra de cadera sin peso: 10–12.</li><li>Elevación de talones: 12–15.</li><li>Plancha apoyada 15–30 s o dead bug 6–10 rep.</li></ol><p>Si aparece dolor agudo, mareo o malestar torácico, detén la sesión.</p>`],
  ['Comer bien sin contar calorías',`<p><b>Mínimo:</b> sustituye bebida azucarada por agua y agrega fruta.</p><p><b>Normal:</b> una comida con proteína, verduras y arroz o papa en porción razonable.</p><p><b>Extra:</b> cocina dos raciones o incluye legumbres/avena. Evita restricciones agresivas; quieres conservar músculo.</p>`],
  ['Si no puedo leer o uso demasiado el celular',`<p><b>Mínimo:</b> 2 páginas y 10 min lejos del teléfono antes de acostarte.</p><p><b>Normal:</b> sigue los minutos de esta semana y programa una ventana fija de redes.</p><p><b>Extra:</b> 10 minutos más de lectura y escucha un álbum completo sin multitarea.</p>`],
  ['Cabello y barba (seguridad)',`<p>Tu minoxidil líquido al 5 % se usa actualmente una vez al día. No cambies dosis ni amplíes el uso a barba sin revisar medicamentos y tolerancia con dermatología. Aplicar solo sobre piel intacta, seca, siguiendo la indicación profesional o etiqueta.</p><p>No apliques minoxidil inmediatamente después del dermaroller; no repitas microneedling casero hasta valoración profesional. Fotografía cabello y barba una vez al mes con luz y ángulo constantes.</p>`],
  ['Erecciones, deseo y control eyaculatorio',`<p>Son tres aspectos distintos. Registra semanalmente cómo te sientes, sin poner metas de minutos. Descanso, dejar tabaco, reducir alcohol, actividad y relaciones sin presión pueden ayudar a la salud general.</p><p>Por dificultades en aproximadamente la mitad de ocasiones durante 3–6 meses y otros medicamentos actuales, solicita revisión médica pronto. No te automediques con sildenafilo/tadalafilo, testosterona o suplementos.</p>`],
  ['Finanzas en un día difícil',`<p>Primero protege alimentación, servicios, transporte, pagos y liquidez. Registra una compra impulsiva antes de hacerla, espera 24 horas si no es esencial y revisa gastos el domingo.</p><p>La meta de ahorro se ajusta después de saber ingresos y obligaciones reales, no por un porcentaje inventado.</p>`],
  ['Cuándo pedir ayuda médica',`<p>Consulta pronto por triglicéridos en 300–499 mg/dL y dificultades sexuales persistentes; lleva análisis y lista de fármacos. Un valor confirmado de triglicéridos ≥500 mg/dL requiere valoración pronta.</p><p>Urgencias ante dolor torácico, desmayo, dificultad respiratoria, palpitaciones importantes o dolor abdominal intenso persistente. Si dejas alcohol y aparecen temblores, confusión o convulsiones, busca atención urgente.</p>`]
  ];return details.map(([title,body])=>`<details><summary>${esc(title)}</summary><div class="detail-body">${body}</div></details>`).join('')}
  function download(name,contents,type){const blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
  const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2);
  function exportJSON(){download('mi-vida-mejor-respaldo-'+todayLocal()+'.json',JSON.stringify({app:'mi-vida-mejor',exportedAt:new Date().toISOString(),data:state},null,2),'application/json;charset=utf-8');notify('Copia descargada. Guárdala en un lugar privado.')}
  function exportCSV(){const keys=['date','cigs','alcohol','walk','read','screen','sleep','music','mood','stress','food','strength','minox'];let lines=[keys.join(',')];for(const d of Object.keys(state.daily).sort()){const r=state.daily[d];lines.push(keys.map(k=>JSON.stringify(k==='date'?d:r[k]??'')).join(','))}download('registro-diario-'+todayLocal()+'.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');notify('CSV descargado')}
  function importJSON(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.app!=='mi-vida-mejor'||!obj.data||typeof obj.data!=='object'||!obj.data.daily||!obj.data.weekly){throw new Error('Archivo de respaldo no válido')}if(!confirm('¿Restaurar esta copia? Reemplazará todos los registros actuales en este navegador.'))return;state=mergeState(obj.data);save();render();notify('Copia restaurada correctamente')}catch(e){alert('No se pudo restaurar el archivo: '+e.message)}};reader.readAsText(file)}
  function setDayField(d,key,val){state.daily[d]||={};if(val===''||val===null)delete state.daily[d][key];else {const n=Number(val);if(!Number.isFinite(n)||n<0||n>10000){notify('Introduce un número válido');return}state.daily[d][key]=n}if(!Object.keys(state.daily[d]).length)delete state.daily[d];save()}
  function setWeekly(w,key,val){state.weekly[w.start]||={};state.weekly[w.start][key]=val;save()}
  function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(new Date(s+'T12:00:00Z').getTime())}
  document.addEventListener('change',ev=>{const t=ev.target;if(t.matches('[data-action-date]')){if(validDate(t.value)&&t.value>=START){state.selectedDate=t.value;state.selectedWeek=Math.min(19,getWeek(t.value).i||19);save();render()}return}if(t.matches('[data-day-field]')){setDayField(selectedDay(),t.dataset.dayField,t.value);render();return}if(t.matches('[data-day-select]')){setDayField(selectedDay(),t.dataset.daySelect,t.value);render();return}if(t.matches('[data-day-check]')){state.daily[selectedDay()]||={};state.daily[selectedDay()][t.dataset.dayCheck]=t.checked;save();render();return}if(t.matches('[data-week-check]')){const w=getWeek(selectedDay()).i===20?getWeek(selectedDay()):WEEKS[(state.selectedWeek||getWeek(selectedDay()).i||1)-1];setWeekly(w,t.dataset.weekCheck,t.checked);render();return}if(t.matches('[data-week-text]')){const w=getWeek(selectedDay()).i===20?getWeek(selectedDay()):WEEKS[(state.selectedWeek||getWeek(selectedDay()).i||1)-1];setWeekly(w,t.dataset.weekText,t.value);return}if(t.matches('[data-intim-field]')){const w=getWeek(selectedDay());setWeekly(w,t.dataset.intimField,t.value===''?'':num(t.value));notify('Registro privado guardado');return}if(t.matches('[data-settings-check]')){if(t.dataset.settingsCheck==='dark')state.settings.theme=t.checked?'dark':'light';if(t.dataset.settingsCheck==='sensitive')state.settings.sensitive=t.checked;save();render();return}if(t.matches('[data-month]')){state.selectedMonth=t.value;save();render();return}});
  document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const k=b.dataset.action,v=b.dataset.value;if(k==='tab'){switchTab(v);return}if(k==='level'){state.daily[selectedDay()]||={};state.daily[selectedDay()].level=v;save();render();return}if(k==='go-date'){state.selectedDate=v;save();switchTab('today');return}if(k==='return-today'){const d=todayLocal();state.selectedDate=d<START?START:d;state.selectedWeek=Math.min(19,getWeek(state.selectedDate).i||19);save();render();return}if(k==='week-prev'||k==='week-next'){let idx=state.selectedWeek||getWeek(selectedDay()).i||1;state.selectedWeek=Math.max(1,Math.min(19,idx+(k==='week-prev'?-1:1)));save();render();return}if(k==='last-week'){state.selectedDate=END;state.selectedWeek=19;save();render();return}if(k==='export'){exportJSON();return}if(k==='csv'){exportCSV();return}if(k==='import'){document.getElementById('import-json').click();return}if(k==='clear'){if(confirm('¿Eliminar definitivamente todos tus registros de este dispositivo? Esta acción no se puede deshacer. Haz un respaldo primero.')){state=emptyState();save();render();notify('Datos locales eliminados')}return}if(k==='del-money'){if(confirm('¿Eliminar este movimiento?')){state.money=state.money.filter(x=>x.id!==v);save();render()}return}if(k==='del-measure'){if(confirm('¿Eliminar esta medición?')){state.measurements=state.measurements.filter(x=>x.id!==v);save();render()}return}if(k==='del-book'){if(confirm('¿Eliminar este libro y su progreso?')){state.books=state.books.filter(x=>x.id!==v);save();render()}return}if(k==='book-finish'){const x=state.books.find(x=>x.id===v);if(x){x.doneDate=todayLocal();if(x.pages)x.progress=x.pages;save();render();notify('Libro terminado. Bien hecho.')}return}if(k==='book-pages'){const x=state.books.find(x=>x.id===v);if(!x)return;const p=prompt(`Páginas leídas de «${x.title}» (total: ${x.pages})`,x.progress||'0');if(p===null)return;const n=Number(p);if(!Number.isInteger(n)||n<0||n>num(x.pages)){alert('Introduce páginas entre 0 y el total del libro.');return}x.progress=n;save();render();notify('Progreso actualizado');return}});
  document.addEventListener('submit',ev=>{const f=ev.target;if(f.id==='money-form'){ev.preventDefault();const data=new FormData(f),date=data.get('date'),type=data.get('type'),amount=Number(data.get('amount'));if(!validDate(date)||!types[type]||!Number.isFinite(amount)||amount<=0||amount>10000000){alert('Revisa los datos del movimiento');return}state.money.push({id:uid(),date,type,amount:Math.round(amount*100)/100,note:String(data.get('note')||'').trim().slice(0,160)});state.selectedMonth=date.slice(0,7);save();render();notify('Movimiento guardado');return}if(f.id==='book-form'){ev.preventDefault();const data=new FormData(f),title=String(data.get('title')||'').trim().slice(0,180),p=String(data.get('pages')||'').trim(),pages=p?Number(p):null;if(!title||pages!==null&&(!Number.isInteger(pages)||pages<1||pages>10000)){alert('Revisa el título y las páginas');return}state.books.push({id:uid(),title,pages,progress:0,doneDate:''});save();render();notify('Libro añadido');return}if(f.id==='measure-form'){ev.preventDefault();const data=new FormData(f),date=data.get('date'),type=data.get('type'),value=Number(data.get('value'));if(!validDate(date)||!labels[type]||value<=0||value>10000||!Number.isFinite(value)){alert('Valor inválido');return}state.measurements.push({id:uid(),date,type,value});save();render();notify('Medición guardada');return}});
  document.getElementById('import-json').addEventListener('change',ev=>{importJSON(ev.target.files[0]);ev.target.value=''});
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  const startupDay=todayLocal();if(startupDay>=START&&startupDay!==state.settings.lastOpened){state.selectedDate=startupDay;state.selectedWeek=Math.min(19,getWeek(startupDay).i||19);if(startupDay.slice(0,7)!==String(state.settings.lastOpened||'').slice(0,7))state.selectedMonth=startupDay.slice(0,7);}state.settings.lastOpened=startupDay;if(!state.selectedDate)state.selectedDate=selectedDay();if(!state.selectedWeek)state.selectedWeek=Math.min(19,getWeek(selectedDay()).i||19);if(!state.selectedMonth)state.selectedMonth=selectedDay().slice(0,7);save();render();
</script>
